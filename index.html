<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Portfolio & Support</title>
    <style>
        /* CSS Styling for Professional Look */
        :root {
            --primary-bg: #f3f4f6;
            --card-bg: #ffffff;
            --btn-demo: #111827;
            --btn-50: #4f46e5;
            --btn-wa: #25d366;
            --btn-web: #0ea5e9;
            --text-light: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            text-align: center;
            box-sizing: border-box;
        }

        /* 9:16 Aspect Ratio Container for Shorts */
        .video-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 9 / 16;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            background-color: #000;
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: none;
            box-sizing: border-box;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-demo {
            background-color: var(--btn-demo);
            color: var(--text-light);
        }

        .btn-50 {
            background-color: var(--btn-50);
            color: var(--text-light);
        }

        .btn-wa {
            background-color: var(--btn-wa);
            color: var(--text-light);
        }

        .btn-web {
            background-color: var(--btn-web);
            color: var(--text-light);
        }

        /* WhatsApp Icon Style */
        .wa-icon {
            width: 20px;
            height: 20px;
            margin-right: 8px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Video Section (Vertical Shorts Format) -->
        <div class="video-wrapper">
            <iframe 
                src="https://www.youtube.com/embed/oG3MzPN8P14?rel=0&modestbranding=1" 
                title="YouTube Shorts Video" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                allowfullscreen>
            </iframe>
        </div>

        <!-- Buttons Section -->
        <div class="btn-group">
            <a href="https://superprofile.bio/vp/motion-graphics-one-video-demo-" class="btn btn-demo" target="_blank">Demo Video</a>
            
            <a href="https://superprofile.bio/vp/50-614-385" class="btn btn-50" target="_blank">50 Video</a>
            
            <button onclick="handleWhatsAppRedirect()" class="btn btn-wa">
                <svg class="wa-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

                </svg>
                Support
            </button>

            <a href="http://staexso.blogspot.com" class="btn btn-web" target="_blank">Website Link</a>
        </div>
    </div>

    <!-- JavaScript for 50/50 Random WhatsApp Redirect -->
    <script>
        function handleWhatsAppRedirect() {
            const number1 = "919128969552";
            const number2 = "918932850102";
            
            const randomChance = Math.floor(Math.random() * 2);
            
            const selectedNumber = (randomChance === 0) ? number1 : number2;
            
            const whatsappUrl = `https://wa.me/${selectedNumber}`;
            
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
